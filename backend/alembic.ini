# ==============================================================================
# Alembic Migration Configuration for TaskFlow
# ==============================================================================

[alembic]
# Path to migration scripts
script_location = %(here)s/alembic

# Template used to generate migration file names
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# Prepend sys.path with current directory
prepend_sys_path = .

# Timezone for generated migration timestamps
timezone = UTC

# Max length of characters for slug
truncate_slug_length = 40

# Set to 'true' to run the environment during the 'revision' command
revision_environment = false

# Set to 'true' to allow .pyc and .pyo files without .py
sourceless = false

# Version table name in database
version_table = alembic_version

# Target database URL (overridden dynamically in env.py from app.core.config)
sqlalchemy.url = postgresql+asyncpg://postgres:postgres@localhost:5432/taskflow_db

[post_write_hooks]
# Post-generation formatting hooks can be enabled here if desired

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
